<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <meta
      name="description"
      content="Kanvora is a modern collaborative workspace app for managing boards, tasks, teams, templates, and productivity workflows."
    />

    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Mobile / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kanvora Workspace" />

    <meta
      property="og:description"
      content="Organize projects, collaborate with teams, and manage workflows using Kanvora."
    />

    <meta property="og:image" content="/favicon.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kanvora Workspace" />

    <meta
      name="twitter:description"
      content="A modern Kanvora-style collaborative project management platform."
    />

    <meta name="twitter:image" content="/favicon.png" />

    <!-- Title -->
    <title>Kanvora Workspace</title>

    <!-- Google Identity is loaded on demand by the auth screens when configured. -->
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
